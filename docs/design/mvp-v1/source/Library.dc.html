<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.35);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,0.55)}
</style>
</helmet>
<div style="--bg:#FFFFFF;--surface:#F3F3F1;--surface2:#E9E9E6;--line:#E2E2DE;--text:#0B0B0C;--muted:#5C5C61;--accent:#0B0B0C;--accentFg:#FFFFFF;--signal:#F0501E; position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="position: relative; z-index: 5; flex: 0 0 auto; display: flex; align-items: center; gap: 2px; min-height: 52px; padding: 4px 6px 0 6px">
<button type="button" onClick="{{toggleMenu}}" aria-haspopup="menu" aria-expanded="{{menuExp}}" style="flex: 0 1 auto; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font-family: inherit; cursor: pointer">
<span aria-hidden="true" style="flex: 0 0 auto; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--accent); color: var(--accentFg); font-size: 15px; font-weight: 800">T</span>
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.section}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<span style="flex: 1 1 auto"></span>
<button type="button" onClick="{{toggleLang}}" aria-label="{{t.langLabel}}" style="flex: 0 0 auto; min-width: 40px; height: 44px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; cursor: pointer">{{langCode}}</button>
<button type="button" aria-label="{{t.import}}" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"></path><path d="M7 10l5 5 5-5"></path><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>
</button>
<a href="Editor.dc.html" aria-label="{{t.newSong}}" style="flex: 0 0 auto; width: 40px; height: 40px; margin-left: 2px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--accent); color: var(--accentFg); text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="{{t.sections}}" style="position: absolute; top: 54px; left: 8px; min-width: 230px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); box-shadow: 0 10px 28px rgba(11,11,12,0.14)">
<sc-for list="{{menu}}" as="mi" hint-placeholder-count="3">
<a role="menuitem" href="{{mi.href}}" aria-current="{{mi.current}}" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px; background: {{mi.bg}}; color: var(--text); text-decoration: none; font-size: 15px; font-weight: {{mi.weight}}"><span style="flex: 1 1 auto">{{mi.label}}</span><span style="font-size: 12px; font-weight: 600; color: var(--muted)">{{mi.hint}}</span></a>
</sc-for>
</div>
</sc-if>
</div>

<div style="flex: 0 0 auto; padding: 2px 12px 0 12px">
<label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border-radius: 8px; background: var(--surface); color: var(--muted)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.search}}</span>
<input type="search" value="{{query}}" onInput="{{onQuery}}" placeholder="{{t.search}}" style="flex: 1 1 auto; min-width: 0; height: 40px; border: 0; background: transparent; color: var(--text); font-family: inherit; font-size: 16px; font-weight: 500; outline: none">
</label>
</div>
<div role="tablist" aria-label="{{t.kind}}" style="flex: 0 0 auto; display: flex; margin: 0 12px; border-bottom: 1px solid var(--line)">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="flex: 0 0 auto; height: 40px; margin: 0 16px -1px 0; padding: 0; border: 0; border-bottom: 3px solid {{tb.under}}; background: transparent; color: {{tb.fg}}; font-family: inherit; font-size: 14px; font-weight: {{tb.weight}}; white-space: nowrap; cursor: pointer">{{tb.label}} <span style="font-weight: 600; color: var(--muted)">{{tb.count}}</span></button>
</sc-for>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(128,128,128,0.35) transparent; padding: 0 12px">
<sc-if value="{{showSongs}}" hint-placeholder-val="{{ true }}">
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{songs}}" as="s" hint-placeholder-count="6">
<li style="{{s.sep}}">
<a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 9px 0; color: var(--text); text-decoration: none">
<span style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
<span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span>
<span style="flex: 0 0 auto; font-size: 18px; font-weight: 800; line-height: 1; letter-spacing: -0.02em">{{s.key}}</span>
</span>
<span style="font-size: 12px; font-weight: 500; color: var(--muted)">{{s.meta}}</span>
<span aria-hidden="true" style="display: flex; gap: 2px; height: 4px">
<sc-for list="{{s.seg}}" as="g" hint-placeholder-count="6"><span style="flex: {{g.grow}} 1 0px; background: {{g.color}}"></span></sc-for>
</span>
</a>
</li>
</sc-for>
</ul>
<sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}"><p style="margin: 16px 0; font-size: 14px; color: var(--muted)">{{t.empty}}</p></sc-if>
</sc-if>
<sc-if value="{{showSets}}" hint-placeholder-val="{{ false }}">
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{sets}}" as="st" hint-placeholder-count="2">
<li style="{{st.sep}}">
<a href="Setlist.dc.html" style="display: flex; flex-direction: column; gap: 3px; padding: 10px 0; color: var(--text); text-decoration: none">
<span style="font-size: 16px; font-weight: 700">{{st.title}}</span>
<span style="font-size: 12px; font-weight: 500; color: var(--muted)">{{st.meta}}</span>
</a>
</li>
</sc-for>
</ul>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"uiLang":{"editor":"enum","options":["en","uk"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: null, query: '', tab: 'songs', menu: false };
  }

  renderVals() {
    const lang = this.state.lang || this.props.uiLang || 'en';
    const STR = {
      en: {
        section: 'Library', sections: 'Sections', search: 'Search songs', kind: 'What to show', songs: 'Songs', sets: 'Setlists',
        newSong: 'New song', import: 'Import .takt files', empty: 'Nothing found. Try another title.', bpm: 'BPM', sectionsWord: 'sections',
        langLabel: 'Language: English. Switch to Ukrainian',
        set1: 'Saturday, 31 October', set1m: '6 songs', set2: 'Worship night — 12 December', set2m: 'Draft',
        mSet: 'Service', mLib: 'Library', mSet2: 'Settings', mSetHint: 'Sat, 31 Oct', mLibHint: 'current',
      },
      uk: {
        section: 'Бібліотека', sections: 'Розділи', search: 'Пошук пісень', kind: 'Що показати', songs: 'Пісні', sets: 'Сетлисти',
        newSong: 'Нова пісня', import: 'Імпорт файлів .takt', empty: 'Нічого не знайдено. Спробуйте іншу назву.', bpm: 'BPM', sectionsWord: 'секцій',
        langLabel: 'Мова: українська. Перемкнути на англійську',
        set1: 'Субота, 31 жовтня', set1m: '6 пісень', set2: 'Воршіп — 12 грудня', set2m: 'Чернетка',
        mSet: 'Служіння', mLib: 'Бібліотека', mSet2: 'Налаштування', mSetHint: 'Сб, 31 жовт', mLibHint: 'зараз',
      },
    };
    const t = STR[lang] || STR.en;
    const C = { I: '#D3D3DE', V: '#4C8DF0', P: '#2EBF8E', C: '#FF9A3D', B: '#9C74F0' };
    const ALL = [
      { title: 'Боже, я вдячний Тобі', key: 'D', bpm: 72, time: '4/4', form: [['I', 3], ['V', 12], ['C', 10], ['I', 1], ['V', 12], ['C', 20], ['I', 6], ['B', 28], ['C', 20]] },
      { title: 'Вдячність', key: 'F#', bpm: 78, time: '6/8', form: [['I', 2], ['V', 8], ['C', 16], ['I', 2], ['V', 8], ['C', 16], ['I', 4], ['B', 24], ['I', 5], ['C', 9]] },
      { title: 'Достойний Ти Один', key: 'D', bpm: 135, time: '4/4', form: [['I', 4], ['V', 9], ['C', 7], ['I', 4], ['V', 8], ['C', 16], ['I', 4], ['B', 16], ['C', 8], ['I', 1]] },
      { title: 'Краса Хреста', key: 'B', bpm: 69, form: [['I', 4], ['V', 8], ['C', 8], ['I', 4], ['V', 8], ['C', 8], ['I', 6], ['V', 8], ['C', 18]] },
      { title: 'Маранафа', key: 'Hm', bpm: 75, time: '4/4', form: [['I', 4], ['V', 8], ['P', 8], ['C', 8], ['V', 8], ['P', 8], ['C', 8], ['I', 4], ['B', 8], ['C', 8], ['I', 1]] },
      { title: 'Могутній Бог', key: 'E', bpm: 86, time: '4/4', form: [['I', 4], ['V', 16], ['C', 16], ['V', 16], ['C', 16], ['C', 14], ['I', 4]] },
    ];
    const q = (this.state.query || '').trim().toLowerCase();
    const list = ALL.filter((s) => !q || s.title.toLowerCase().indexOf(q) >= 0);
    const tab = this.state.tab;
    const mkTab = (id, label, count) => ({
      label: label, count: String(count), sel: tab === id ? 'true' : 'false',
      under: tab === id ? 'var(--signal)' : 'transparent', fg: tab === id ? 'var(--text)' : 'var(--muted)', weight: tab === id ? 800 : 600,
      pick: () => this.setState({ tab: id }),
    });
    const menuOpen = this.state.menu;
    const mi = (href, label, hint, cur) => ({ href: href, label: label, hint: hint, current: cur ? 'page' : 'false', bg: cur ? 'var(--surface)' : 'transparent', weight: cur ? 800 : 600 });
    return {
      t: t,
      langCode: lang === 'uk' ? 'UA' : 'EN',
      toggleLang: () => this.setState({ lang: lang === 'uk' ? 'en' : 'uk' }),
      menuOpen: menuOpen,
      menuExp: menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !menuOpen }),
      menu: [mi('Setlist.dc.html', t.mSet, t.mSetHint, false), mi('Library.dc.html', t.mLib, t.mLibHint, true), mi('Settings.dc.html', t.mSet2, '', false)],
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e && e.target ? e.target.value : '' }),
      tabs: [mkTab('songs', t.songs, ALL.length), mkTab('sets', t.sets, 2)],
      showSongs: tab === 'songs',
      showSets: tab === 'sets',
      noMatch: list.length === 0,
      songs: list.map((s, i) => {
        const parts = [s.bpm + ' ' + t.bpm];
        if (s.time) parts.push(s.time);
        parts.push(s.form.length + ' ' + t.sectionsWord);
        return { title: s.title, key: s.key, meta: parts.join(' · '), seg: s.form.map((x) => ({ grow: x[1], color: C[x[0]] })), sep: i > 0 ? 'border-top: 1px solid var(--line);' : '' };
      }),
      sets: [
        { title: t.set1, meta: t.set1m, sep: '' },
        { title: t.set2, meta: t.set2m, sep: 'border-top: 1px solid var(--line);' },
      ],
    };
  }
}
</script>
</body>
</html>
