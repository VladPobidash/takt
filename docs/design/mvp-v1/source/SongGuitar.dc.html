<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Song — guitar view, auto-scroll</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.35);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,0.55)}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'Onest', system-ui, sans-serif">
<dc-import name="Main" theme="light" ui-lang="uk" start-view="guitar" layout="phone" start-playing="true" start-beat="212" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
