name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits: the change and what it is compared with (the tip of main under a
          # pull request's merge commit, or the commit before a push to main).
          fetch-depth: 2
      - name: A change to the app raises its version (ADR 0014)
        run: node scripts/check-version.mjs HEAD^1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install the browser for the smoke tests
        run: pnpm --filter @takt/web exec playwright install --with-deps chromium
      - run: pnpm e2e
